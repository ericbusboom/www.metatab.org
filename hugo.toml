baseURL = "https://www.metatab.org/"
languageCode = "en-us"
title = "Metatab"
theme = "wp-static"

[pagination]
pagerSize = 10

# Blog posts live in year folders (/2016/10/25/...), so their type would be
# the year. Give them all type "post" for the post lists.
[[cascade]]
type = "post"
[cascade.target]
path = "{/20*/**}"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "friendly"

[params]
description = "Metadata for Mortals"
subtitle = "Metadata for Mortals"
blogHomepage = false
sidebar = false
showCategories = true
accentColor = "#2c5cc5"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Posts"
url = "/posts/"
weight = 2

[[menu.main]]
name = "Projects"
url = "/projects/"
weight = 3

[[menu.main]]
name = "Papers"
url = "/papers/"
weight = 4

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 5
